name: Android Build

on:
  push:
    branches:
      - feature/simplified-chinese
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Locate generated APK
        if: success()
        run: |
          echo "APK files generated by Gradle:"
          find app/build/outputs -type f -name '*.apk' -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 9GRadio-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
